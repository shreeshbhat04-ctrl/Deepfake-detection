<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeFake</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            width: 350px;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
            color: var(--text);
        }

        .icon-shield {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
            padding: 4px 8px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        /* Content Areas */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Upload Zone */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--card);
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.05);
        }

        .upload-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .upload-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            border-color: var(--primary);
        }

        /* Result */
        #result-area {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            display: none;
        }

        .result-verdict {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        
        .REAL { color: var(--success); }
        .FAKE { color: var(--danger); }

        .result-conf {
            font-size: 12px;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 100px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 8px;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        textarea:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }
        
        .snipping-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .snipping-btn:hover {
            opacity: 0.9;
        }
        
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="header">
        <svg class="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <h1>DeFake</h1>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="upload">Upload</button>
        <button class="tab" data-tab="text">Text</button>
        <button class="tab" data-tab="snip">Snipping Tool</button>
    </div>

    <!-- Upload Tab -->
    <div id="upload" class="tab-content active">
        <div class="upload-zone" id="drop-zone">
            <div class="upload-title">Drop Video or Image</div>
            <div class="upload-desc">or click to browse</div>
        </div>
        <input type="file" id="file-input" hidden accept="video/*,image/*">
        <div id="file-name" style="margin-top: 8px; font-size: 12px; color: var(--text-muted); text-align: center;"></div>
        <button id="analyze-btn" class="btn" disabled>Analyze File</button>
    </div>

    <!-- Text Tab -->
    <div id="text" class="tab-content">
        <textarea id="text-input" placeholder="Paste text to analyze for AI generation..."></textarea>
        <button id="analyze-text-btn" class="btn">Analyze Text</button>
    </div>
    
    <!-- Snip Tab -->
    <div id="snip" class="tab-content">
         <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">
            Capture any part of your browser window to detect deepfakes or AI content.
         </p>
         <button id="start-snip-btn" class="btn snipping-btn">
             Start Snipping Tool
         </button>
    </div>

    <!-- Result Area -->
    <div id="result-area">
        <div class="result-verdict" id="verdict">REAL</div>
        <div class="result-conf" id="confidence">Confidence: 98.5%</div>
    </div>
    
    <div class="footer">
        Powered by DeepGuard AI
    </div>

    <script src="popup.js"></script>
</body>
</html>
